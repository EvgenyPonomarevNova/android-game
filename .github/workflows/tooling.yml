name: Preparation tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify PowerShell and imported skills
        shell: pwsh
        run: ./tools/verify-project.ps1
